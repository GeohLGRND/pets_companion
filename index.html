<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-pets-companion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="tela">

   <button>
    
   </button>  

    <!-- LADO ESQUERDO: boas-vindas -->
    <section class="lado-esquerdo">
      <span class="pata pata-cima">🐾</span>
      <span class="pata pata-baixo">🐾</span>

      <div class="boas-vindas">
        <h2>Seja bem-vindo ao Pet's Companion!</h2>
        <p>Crie uma conta para iniciar ou entre com uma existente.</p>
      </div>
    </section>

    <!-- LADO DIREITO: formulário -->
    <section class="lado-direito">
      <form class="formulario">
        <h1>Login</h1>

        <input type="text" placeholder="Nome de usuário ou e-mail." required>
        <input type="password" placeholder="Senha." required>

        <button type="submit">ENTRAR</button>
      </form>
    </section>

  </main>
