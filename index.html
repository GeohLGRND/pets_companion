<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login-pets-companion</title>
  <link rel="stylesheet" href="style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>


  <!-- CABEÇALHO -->
  <header class="header">
    <div class="mover">
      
          <div class="logo">
      
            <img src="../img/Container.svg" alt="logo patinha">
      
          </div>

    </div>

    </div>
  </header>

  <main class="tela">

    <!-- LADO ESQUERDO: boas-vindas -->
    <section class="lado-esquerdo">
      <span class="pata pata-cima">🐾</span>
      <span class="pata pata-baixo">🐾</span>

      <div class="boas-vindas">
        <h2>Seja bem-vindo ao Pet's Companion!</h2>
        <p>Crie uma conta para iniciar ou entre com uma existente.</p>
      </div>
    </section>

    <!-- LADO DIREITO: formulário -->
    <section class="lado-direito">
      <form class="formulario">
        <h1>Login</h1>

        <input type="text" placeholder="Nome de usuário ou e-mail." required>
        <input type="password" placeholder="Senha." required>

        <button type="submit">ENTRAR</button>
      </form>
    </section>

  </main>

 <!-- FOOTER / RODAPÉ -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-brand">
                <h3>🐾 Pet's Companion</h3>
                <p>Dedicados ao bem-estar e alegria do seu companheiro de quatro patas.</p>
            </div>
            <div class="footer-nav">
                <h4>Navegação</h4>
                <a href="#">Início</a>
                <a href="#">Produtos</a>
                <a href="#">Contato</a>
            </div>
        </div>
        <p class="copyright">&copy; 2026 Pet's Companion. Todos os direitos reservados.</p>
    </footer>


</body>

</html>
